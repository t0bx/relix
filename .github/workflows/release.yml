name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Compare tag with workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match workspace version $manifest"
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

  checks:
    name: Quality checks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            run_prefix: arch -x86_64
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --package relix --target ${{ matrix.target }}
      - name: Validate binary
        shell: bash
        run: ${{ matrix.run_prefix }} ./target/${{ matrix.target }}/release/relix --version
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="relix-v${{ needs.validate.outputs.version }}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/relix" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "relix-v${{ needs.validate.outputs.version }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/relix.exe", README.md, LICENSE -Destination "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: cd dist && cat *.sha256 | sort -k2 > SHA256SUMS && sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: RELIX v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  arch-repo:
    name: Publish Arch repository
    needs: [validate, publish]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm base-devel github-cli

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifact

      - name: Prepare build user
        run: |
          useradd -m builder
          chown -R builder:builder .

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | sudo -u builder -H gpg --batch --import

      - name: Build and sign package
        run: |
          checksum="$(cut -d ' ' -f1 "artifact/relix-v$VERSION-linux-x86_64.tar.gz.sha256")"
          cd packaging/arch
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('$checksum')/" PKGBUILD
          sudo -u builder -H env GPGKEY="$GPG_KEY_ID" makepkg --sign --noconfirm

      - name: Create signed repository database
        run: |
          mkdir repo
          cp packaging/arch/*.pkg.tar.zst packaging/arch/*.pkg.tar.zst.sig repo/
          chown -R builder:builder repo
          cd repo
          sudo -u builder -H repo-add --sign --key "$GPG_KEY_ID" relix.db.tar.gz *.pkg.tar.zst
          for f in relix.db relix.db.sig relix.files relix.files.sig; do
            cp --remove-destination "$(readlink "$f")" "$f"
          done

      - name: Publish repository release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete repo --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create repo repo/* --repo "$GITHUB_REPOSITORY" --title "Arch Linux repository" --notes "Signed pacman repository for RELIX. Setup: see README." --latest=false