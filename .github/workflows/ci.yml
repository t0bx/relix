name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  metadata:
    name: Cargo metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate manifests and lockfile
        run: cargo metadata --format-version 1 --locked > /dev/null

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  integration:
    name: Integration tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: postgres-family
            services: postgres cockroachdb timescaledb yugabytedb
            ports: ""
            run: cargo test -p relix-driver-postgres --locked -- --test-threads=1
          - group: mysql-family-and-redis-family
            services: mysql mariadb tidb redis valkey
            ports: "54000"
            run: cargo test -p relix-driver-mysql -p relix-driver-redis --locked
          - group: sql-server-oracle
            services: mssql oracle
            ports: "51433"
            run: cargo test -p relix-driver-mssql -p relix-driver-oracle --locked
          - group: analytics
            services: clickhouse trino bigquery
            ports: "59050"
            run: cargo test -p relix-driver-clickhouse -p relix-driver-trino -p relix-driver-bigquery --locked
          - group: documents-and-search
            services: mongodb dynamodb elasticsearch opensearch
            ports: "58000"
            run: cargo test -p relix-driver-mongodb -p relix-driver-dynamodb -p relix-driver-search --locked
          - group: wide-column-graph-time-series
            services: scylladb cassandra neo4j influxdb
            ports: ""
            run: >-
              RELIX_TEST_CQL_ENGINE=scylladb cargo test -p relix-driver-cassandra --locked &&
              RELIX_TEST_CQL_ENGINE=cassandra cargo test -p relix-driver-cassandra --locked -- --test-threads=1 &&
              cargo test -p relix-driver-neo4j -p relix-driver-influxdb --locked
    env:
      RELIX_INTEGRATION: "1"
      MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2022-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: integration-${{ matrix.group }}
      - name: Install Oracle Instant Client
        if: matrix.group == 'sql-server-oracle'
        run: |
          sudo apt-get update
          sudo apt-get install -y libaio1t64 unzip
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          curl -sSfLo /tmp/instantclient.zip https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          sudo unzip -q /tmp/instantclient.zip -d /opt/oracle
          client_dir="$(ls -d /opt/oracle/instantclient_*)"
          echo "RELIX_TEST_ORACLE_CLIENT_LIB_DIR=$client_dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$client_dir" >> "$GITHUB_ENV"
      - name: Start test databases
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 600 ${{ matrix.services }}
      - name: Wait for services without a readiness check
        if: matrix.ports != ''
        run: |
          for port in ${{ matrix.ports }}; do
            for attempt in $(seq 1 90); do
              (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null && break
              sleep 2
            done
          done
          sleep 20
      - name: Run tests against live databases
        run: ${{ matrix.run }}
      - name: Show database logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail 200
      - name: Stop test databases
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  build:
    name: Release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --locked
      - name: Smoke test the binary
        shell: bash
        run: ./target/release/relix --version

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --all-features --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
