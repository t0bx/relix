# Ephemeral databases for RELIX integration tests: `docker compose -f docker-compose.test.yml up -d`
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relix
      POSTGRES_PASSWORD: relix_test
      POSTGRES_DB: relix_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relix -d relix_test"]
      interval: 2s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: relix_root
      MYSQL_USER: relix
      MYSQL_PASSWORD: relix_test
      MYSQL_DATABASE: relix_test
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urelix", "-prelix_test"]
      interval: 2s
      retries: 60
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: relix_root
      MARIADB_USER: relix
      MARIADB_PASSWORD: relix_test
      MARIADB_DATABASE: relix_test
    ports:
      - "53307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "relix_test"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "relix_test", "ping"]
      interval: 2s
      retries: 30
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ELASTIC_PASSWORD: relix_test
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    ports:
      - "59200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:relix_test localhost:9200/_cluster/health | grep -q status"]
      interval: 3s
      retries: 60
  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    ports:
      - "59201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -q status"]
      interval: 3s
      retries: 60
