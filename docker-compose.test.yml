# Ephemeral databases for RELIX integration tests: `docker compose -f docker-compose.test.yml up -d`
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relix
      POSTGRES_PASSWORD: relix_test
      POSTGRES_DB: relix_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relix -d relix_test"]
      interval: 2s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: relix_root
      MYSQL_USER: relix
      MYSQL_PASSWORD: relix_test
      MYSQL_DATABASE: relix_test
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urelix", "-prelix_test"]
      interval: 2s
      retries: 60
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: relix_root
      MARIADB_USER: relix
      MARIADB_PASSWORD: relix_test
      MARIADB_DATABASE: relix_test
    ports:
      - "53307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "relix_test"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "relix_test", "ping"]
      interval: 2s
      retries: 30
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ELASTIC_PASSWORD: relix_test
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    ports:
      - "59200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:relix_test localhost:9200/_cluster/health | grep -q status"]
      interval: 3s
      retries: 60
  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    ports:
      - "59201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -q status"]
      interval: 3s
      retries: 60
  mongodb:
    image: mongo:8
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: relix
      MONGO_INITDB_ROOT_PASSWORD: relix_test
    ports:
      - "57017:27017"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "relix", "-p", "relix_test", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 2s
      retries: 30
  dynamodb:
    image: amazon/dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "58000:8000"
    mem_limit: 512m
  cockroachdb:
    image: cockroachdb/cockroach:latest
    command: ["start-single-node", "--insecure", "--cache=64MiB", "--max-sql-memory=128MiB"]
    ports:
      - "56257:26257"
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 2s
      retries: 60
  yugabytedb:
    image: yugabytedb/yugabyte:latest
    command: ["bin/yugabyted", "start", "--background=false", "--tserver_flags=ysql_enable_auth=true"]
    ports:
      - "55433:5433"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=yugabyte bin/ysqlsh -h $$(hostname) -U yugabyte -c 'SELECT 1'"]
      interval: 5s
      retries: 60
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: relix
      POSTGRES_PASSWORD: relix_test
      POSTGRES_DB: relix_test
      TS_TUNE_MEMORY: 256MB
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relix -d relix_test"]
      interval: 2s
      retries: 30
  tidb:
    image: pingcap/tidb:v8.5.3
    command: ["--config=/etc/tidb.toml"]
    configs:
      - source: tidb_config
        target: /etc/tidb.toml
    ports:
      - "54000:4000"
  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--requirepass", "relix_test"]
    ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "relix_test", "ping"]
      interval: 2s
      retries: 30
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Relix_test1!"
    ports:
      - "51433:1433"
    mem_limit: 1536m
  oracle:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: relix_root
      APP_USER: relix
      APP_USER_PASSWORD: relix_test
    ports:
      - "51521:1521"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 60
  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    platform: linux/amd64
    command: ["--project=relix-test"]
    ports:
      - "59050:9050"
  scylladb:
    image: scylladb/scylla
    command: ["--smp", "1", "--memory", "512M", "--overprovisioned", "1", "--authenticator", "PasswordAuthenticator", "--authorizer", "CassandraAuthorizer", "--auth-superuser-name", "cassandra", "--auth-superuser-salted-password", "\\$$6\\$$acHeRyEUDXZAd02B\\$$T8R40y5wwIT8Ysr.rb7d2Zmd1fjc9ejAuW.TsAoX0/opxG84Xqs5av3.5bhxZNR2qMFM1NQYq7LCwrGq/PmjX."]
    ports:
      - "59042:9042"
    mem_limit: 900m
  cassandra:
    image: cassandra:5
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    entrypoint: ["bash", "-c", "sed -i -e 's/AllowAllAuthenticator/PasswordAuthenticator/' -e 's/AllowAllAuthorizer/CassandraAuthorizer/' -e 's/^materialized_views_enabled: false/materialized_views_enabled: true/' /etc/cassandra/cassandra.yaml && exec docker-entrypoint.sh cassandra -f"]
    ports:
      - "59043:9042"
    mem_limit: 1536m
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/relix_test_pw
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "57687:7687"
    mem_limit: 1g
  influxdb:
    image: influxdb:3-core
    command: ["influxdb3", "serve", "--node-id", "relix", "--object-store", "memory", "--without-auth"]
    ports:
      - "58181:8181"
    mem_limit: 512m
configs:
  tidb_config:
    content: |
      [security]
      auto-tls = true
