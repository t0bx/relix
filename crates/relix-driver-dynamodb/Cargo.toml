[package]
name = "relix-driver-dynamodb"
description = "Native Amazon DynamoDB document driver for the RELIX database IDE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
relix-core.workspace = true
relix-driver-api.workspace = true
async-trait.workspace = true
aws-config = { version = "1.13.0", default-features = false, features = [
    "rt-tokio",
    "sso",
    "credentials-process",
    "behavior-version-latest",
] }
aws-sdk-dynamodb = { version = "1.134.0", default-features = false, features = [
    "rt-tokio",
    "behavior-version-latest",
] }
aws-smithy-http-client = { version = "1.1.9", default-features = false, features = ["rustls-ring"] }
aws-smithy-types = "1.4.3"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "fs"] }

[dev-dependencies]
relix-testing = { path = "../relix-testing" }
pretty_assertions.workspace = true
tokio.workspace = true

[lints]
workspace = true
