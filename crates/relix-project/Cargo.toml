[package]
name = "relix-project"
description = "Project, session and credential persistence for RELIX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
relix-core.workspace = true
relix-config.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "1.1.8"
uuid.workspace = true
keyring-core = "1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true
