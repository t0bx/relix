[package]
name = "relix-driver-postgres"
description = "Native PostgreSQL driver for the RELIX database IDE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
relix-core.workspace = true
relix-driver-api.workspace = true
relix-query = { path = "../relix-query" }
async-trait.workspace = true
tokio.workspace = true
futures-util = { version = "0.3.31", default-features = false }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
webpki-roots = "1.0.9"

[dev-dependencies]
relix-testing = { path = "../relix-testing" }
tokio.workspace = true

[lints]
workspace = true
