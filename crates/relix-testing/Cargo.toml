[package]
name = "relix-testing"
description = "Shared test fixtures, mock drivers and integration helpers for RELIX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
relix-core.workspace = true
relix-driver-api.workspace = true
async-trait.workspace = true
serde_json.workspace = true
rand = { version = "0.10", features = ["thread_rng"], optional = true }
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"], optional = true }
tokio = { workspace = true, features = ["net"], optional = true }

[features]
ssh = ["dep:rand", "dep:russh", "dep:tokio"]

[lints]
workspace = true
