[package]
name = "relix-driver-redis"
description = "Native Redis key-value driver for the RELIX database IDE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
relix-core.workspace = true
relix-driver-api.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["fs"] }
redis = { version = "1.8.0", default-features = false, features = [
    "tokio-rustls-comp",
    "tls-rustls-insecure",
    "connection-manager",
    "num-bigint",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
relix-testing = { path = "../relix-testing" }
pretty_assertions.workspace = true
tokio.workspace = true

[lints]
workspace = true
