[package]
name = "relix-ssh"
description = "SSH sessions, host key verification and local port forwarding for RELIX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
relix-core.workspace = true
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing = "0.1.44"

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
relix-testing = { workspace = true, features = ["ssh"] }
tempfile = "3.27.0"
tokio.workspace = true

[lints]
workspace = true
