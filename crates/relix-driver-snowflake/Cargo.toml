[package]
name = "relix-driver-snowflake"
description = "Native Snowflake driver for the RELIX database IDE, built on the Snowflake SQL API v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
relix-core.workspace = true
relix-driver-api.workspace = true
relix-driver-http = { path = "../relix-driver-http" }
relix-query = { path = "../relix-query" }
async-trait.workspace = true
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
jsonwebtoken = { version = "9.3.1", default-features = false }
pkcs8 = { version = "0.10.2", features = ["3des"] }
rsa = { version = "0.9.10", features = ["pkcs5"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
relix-testing = { path = "../relix-testing" }
tokio.workspace = true
wiremock = "0.6.5"

[lints]
workspace = true
