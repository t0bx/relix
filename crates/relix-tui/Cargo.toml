[package]
name = "relix-tui"
description = "Ratatui based terminal user interface for RELIX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
relix-app = { path = "../relix-app" }
relix-config.workspace = true
relix-core.workspace = true
relix-editor = { path = "../relix-editor" }
relix-query = { path = "../relix-query" }
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
futures-util = "0.3.32"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "underline-color", "layout-cache"] }
tokio.workspace = true
tracing = "0.1.44"
unicode-width = "0.2.2"

[dev-dependencies]
serde_json.workspace = true
relix-app = { path = "../relix-app", features = ["test-support"] }
relix-testing.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true
