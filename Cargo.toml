[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["t0bx"]
repository = "https://github.com/t0bx/relix"
homepage = "https://github.com/t0bx/relix"
readme = "README.md"
keywords = ["database", "tui", "sql", "redis", "ide"]
categories = ["command-line-utilities", "database"]

[workspace.dependencies]
relix-core = { path = "crates/relix-core" }
relix-driver-api = { path = "crates/relix-driver-api" }
relix-config = { path = "crates/relix-config" }
relix-project = { path = "crates/relix-project" }
relix-testing = { path = "crates/relix-testing" }

anyhow = "1.0.104"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
pretty_assertions = "1.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
